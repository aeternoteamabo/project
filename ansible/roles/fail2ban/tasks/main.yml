---
- name: Установить настройки Fail2ban для SSH
  ansible.builtin.template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: '0644'
  register: fail2ban_ssh_config

- name: Проверить конфигурацию Fail2ban
  ansible.builtin.command: fail2ban-client -t
  changed_when: fail2ban_ssh_config.changed
  notify: Reload fail2ban

- name: Включить автозапуск и запустить Fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban.service
    enabled: true
    state: started
