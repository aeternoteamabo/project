services:
  prometheus:
    image: prom/prometheus:v3.5.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring_net
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d", "--web.listen-address=0.0.0.0:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
  node-exporter:
    image: prom/node-exporter:v1.9.1
    network_mode: host
    restart: unless-stopped
    pid: host
    command: ["--path.rootfs=/host", "--web.listen-address=0.0.0.0:9100"]
    volumes:
      - /:/host:ro
  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    networks:
      - monitoring_net
    restart: unless-stopped
    command: ["--config.file=/config/blackbox.yml", "--web.listen-address=0.0.0.0:9115"]
    volumes:
      - ./blackbox:/config:ro
  alertmanager:
    image: prom/alertmanager:v0.28.1
    networks:
      - monitoring_net
    restart: unless-stopped
    command: ["--config.file=/config/alertmanager.yml", "--storage.path=/alertmanager", "--web.listen-address=0.0.0.0:9093", "--cluster.listen-address="]
    volumes:
      - ./alertmanager:/config:ro
      - alertmanager:/alertmanager
  loki:
    image: grafana/loki:3.5.0
    networks:
      - monitoring_net
    restart: unless-stopped
    command: ["-config.file=/etc/loki-lab/loki.yml"]
    volumes:
      - ./loki:/etc/loki-lab:ro
      - loki:/loki
  alloy:
    image: grafana/alloy:v1.8.3
    networks:
      - monitoring_net
    restart: unless-stopped
    user: "0:0"
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy-lab/config.alloy"]
    volumes:
      - ./alloy:/etc/alloy-lab:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /run/log:/run/log:ro
      - /var/log/journal:/var/log/journal:ro
      - alloy:/var/lib/alloy/data
  grafana:
    image: grafana/grafana:12.0.1
    networks:
      - monitoring_net
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/dashboards:ro
      - grafana:/var/lib/grafana

volumes:
  prometheus:
  alertmanager:
  loki:
  alloy:
  grafana:
networks:
  monitoring_net:
    name: "${MONITORING_NETWORK_NAME:-monitoring_net}"
    driver: bridge
