groups:
  - name: wsl
    rules:
      - alert: HighCPU
        expr: >-
          100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 5m
        labels:
          severity: warning
      - alert: HighRAM
        expr: >-
          100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 5m
        labels:
          severity: warning
      - alert: LowDisk
        expr: >-
          100 * (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 85
        for: 5m
        labels:
          severity: warning
      - alert: NodeExporterDown
        expr: >-
          up{job="node"} == 0
        for: 1m
        labels:
          severity: warning
      - alert: HTTPServiceDown
        expr: >-
          probe_success == 0 or up{job="blackbox"} == 0
        for: 1m
        labels:
          severity: warning
      - alert: MonitoringPracticeTest
        expr: vector(1)
        labels:
          severity: info
