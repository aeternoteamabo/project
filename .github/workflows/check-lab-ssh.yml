name: Check lab SSH

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  check-ssh:
    name: Check SSH over Tailscale
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: lab
    timeout-minutes: 5

    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-deploy

      - name: Read the OpenSSH banner
        env:
          LAB_TAILSCALE_IP: ${{ vars.LAB_TAILSCALE_IP }}
        run: |
          if [[ -z "$LAB_TAILSCALE_IP" ]]; then
            echo "LAB_TAILSCALE_IP is missing from the lab environment"
            exit 1
          fi

          if timeout 10s bash -c '
            exec 3<>"/dev/tcp/$1/2222"
            IFS= read -r banner <&3
            [[ "$banner" == SSH-* ]]
          ' _ "$LAB_TAILSCALE_IP" 2>/dev/null; then
            echo "OpenSSH answered on TCP port 2222"
          else
            echo "No SSH banner received on TCP port 2222"
            exit 1
          fi
      - name: Verify adminops SSH login
        env:
          LAB_TAILSCALE_IP: ${{ vars.LAB_TAILSCALE_IP }}
          LAB_SSH_KNOWN_HOSTS: ${{ vars.LAB_SSH_KNOWN_HOSTS }}
          LAB_SSH_PRIVATE_KEY: ${{ secrets.LAB_SSH_PRIVATE_KEY }}
        run: |
          : "${LAB_TAILSCALE_IP:?Missing LAB_TAILSCALE_IP}"
          : "${LAB_SSH_KNOWN_HOSTS:?Missing LAB_SSH_KNOWN_HOSTS}"
          : "${LAB_SSH_PRIVATE_KEY:?Missing LAB_SSH_PRIVATE_KEY}"

          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$LAB_SSH_PRIVATE_KEY" > "$ssh_dir/deploy_key"
          printf '%s\n' "$LAB_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          login=$(ssh -T -o BatchMode=yes -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o HostKeyAlias=fedora44-ansible-lab \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -i "$ssh_dir/deploy_key" -p 2222 \
            "adminops@$LAB_TAILSCALE_IP" 'id -un')

          if [[ "$login" != adminops ]]; then
            echo 'Expected remote user adminops'
            exit 1
          fi
          echo 'SSH login verified: adminops'
