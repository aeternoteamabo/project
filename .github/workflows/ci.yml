name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Ansible and Compose
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Ansible dependencies
        working-directory: ansible
        run: |
          python -m pip install -r requirements.txt
          ansible-galaxy collection install -r collections/requirements.yml

      - name: Check Ansible playbook syntax
        working-directory: ansible
        run: |
          inventory="$RUNNER_TEMP/ci-inventory.ini"
          printf '[monitoring]\nci-host ansible_connection=local\n' > "$inventory"
          ansible-playbook -i "$inventory" playbooks/bootstrap/main.yml --syntax-check
          ansible-playbook -i "$inventory" playbooks/deploy/main.yml --syntax-check

      - name: Validate Docker Compose configuration
        working-directory: infra-monitoring
        run: |
          docker compose version
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.bootstrap.yaml config --quiet
