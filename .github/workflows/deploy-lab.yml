name: Deploy lab

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-lab
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy monitoring to Fedora lab
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: lab
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Ansible dependencies
        working-directory: ansible
        run: |
          python -m pip install -r requirements.txt
          ansible-galaxy collection install -r collections/requirements.yml

      - name: Join the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-deploy

      - name: Run the Deploy playbook
        working-directory: ansible
        env:
          LAB_TAILSCALE_IP: ${{ vars.LAB_TAILSCALE_IP }}
          LAB_SSH_KNOWN_HOSTS: ${{ vars.LAB_SSH_KNOWN_HOSTS }}
          LAB_SSH_PRIVATE_KEY: ${{ secrets.LAB_SSH_PRIVATE_KEY }}
          LAB_BECOME_PASSWORD: ${{ secrets.LAB_BECOME_PASSWORD }}
          LAB_GRAFANA_ADMIN_PASSWORD: ${{ secrets.LAB_GRAFANA_ADMIN_PASSWORD }}
        run: |
          : "${LAB_TAILSCALE_IP:?Missing LAB_TAILSCALE_IP}"
          : "${LAB_SSH_KNOWN_HOSTS:?Missing LAB_SSH_KNOWN_HOSTS}"
          : "${LAB_SSH_PRIVATE_KEY:?Missing LAB_SSH_PRIVATE_KEY}"
          : "${LAB_BECOME_PASSWORD:?Missing LAB_BECOME_PASSWORD}"

          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$LAB_SSH_PRIVATE_KEY" > "$ssh_dir/deploy_key"
          printf '%s\n' "$LAB_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          python3 - "$ssh_dir" > "$ssh_dir/deploy-vars.json" <<'PY'
          import json
          import os
          import sys

          ssh_dir = sys.argv[1]
          variables = {
              "ansible_host": os.environ["LAB_TAILSCALE_IP"],
              "ansible_ssh_private_key_file": f"{ssh_dir}/deploy_key",
              "ansible_ssh_common_args": (
                  "-o BatchMode=yes -o IdentitiesOnly=yes "
                  "-o StrictHostKeyChecking=yes "
                  f"-o UserKnownHostsFile={ssh_dir}/known_hosts "
                  "-o HostKeyAlias=fedora44-ansible-lab "
                  "-o HostKeyAlgorithms=ssh-ed25519"
              ),
              "ansible_become_password": os.environ["LAB_BECOME_PASSWORD"],
          }
          grafana_password = os.environ.get("LAB_GRAFANA_ADMIN_PASSWORD")
          if grafana_password:
              variables["vault_grafana_admin_password"] = grafana_password

          json.dump(variables, sys.stdout)
          PY

          unset LAB_SSH_PRIVATE_KEY LAB_BECOME_PASSWORD LAB_GRAFANA_ADMIN_PASSWORD

          ansible-playbook -i inventory/fedora44-clean.ini playbooks/deploy/main.yml \
            --limit mon-server \
            --extra-vars "@$ssh_dir/deploy-vars.json"
